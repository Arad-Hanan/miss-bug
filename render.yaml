services:
  - type: web
    name: miss-bug
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: miss-bug-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SECRET1
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /opt/render/project/src/data